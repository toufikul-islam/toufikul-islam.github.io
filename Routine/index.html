<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>My Routine</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--ac:#2563eb;--lab:#e8f8ec;--labb:#22a34a;--now:#fff4d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#e8eaed;--mu:#9aa3ad;--bd:#2c333c;--ac:#6ea0ff;--lab:#14301f;--labb:#3ecf6e;--now:#3a3213}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#e8eaed;--mu:#9aa3ad;--bd:#2c333c;--ac:#6ea0ff;--lab:#14301f;--labb:#3ecf6e;--now:#3a3213}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 2px}.mu{color:var(--mu);font-size:13px}
.hero{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.hero b{font-size:17px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button,.tg button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:20px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.tabs button.on,.tg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs button.today:not(.on){border-color:var(--ac)}
.tg{display:flex;gap:6px;margin:10px 0}
.c{display:flex;gap:10px;margin:10px 0}
.t{width:62px;font-size:12px;color:var(--mu);padding-top:12px;flex:none}
.k{flex:1;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:10px 12px}
.k.lab{background:var(--lab);border-left-color:var(--labb)}.k.now{background:var(--now);outline:2px solid #f5b50a}
.r{display:flex;justify-content:space-between;font-weight:700}
.tag{display:inline-block;font-size:11px;background:var(--bd);border-radius:4px;padding:1px 6px;margin-top:4px}
.empty{text-align:center;color:var(--mu);padding:36px 0}
.sc{overflow-x:auto}table{border-collapse:collapse;min-width:720px;width:100%}
th,td{border:1px solid var(--bd);padding:5px;font-size:11px;vertical-align:top;background:var(--card)}
th{background:var(--bd)}td.l{background:var(--lab)}
</style></head><body><div class="w">
<h1>My Routine</h1><div class="mu">Toufikul Islam · B.Sc. in CSE</div>
<div class="hero" id="hero"></div>
<div class="tg"><button id="bd" class="on">Day</button><button id="bw">Week</button></div>
<div class="tabs" id="tabs"></div><div id="v"></div></div>
<script>
const S=[["09:00","10:15"],["10:15","11:30"],["11:30","12:45"],["13:15","14:30"],["14:30","15:45"],["15:45","17:00"]];
const D=["Saturday","Sunday","Monday","Tuesday","Wednesday","Thursday"];
const P="E-commerce and Web Programming";
// [slot,code,section,title,room,isLab]
const R={
Saturday:[],
Sunday:[[2,"CSE 3210","6th-A",P+" Project Lab","104 CNL",1],[3,"CSE 3210","6th-A",P+" Project Lab","104 CNL",1],[5,"CSE 1100","1st-B","Computer Fundamentals Lab","104 CNL",0],[6,"CSE 3209","6th-C",P,"513",0]],
Monday:[[2,"CSE 3209","6th-B",P,"1012",0],[4,"CSE 1100","1st-A","Computer Fundamentals Lab","106 DSAL",0],[5,"CSE 3209","6th-A",P,"514",0]],
Tuesday:[[2,"CSE 3209","6th-B",P,"311",0],[3,"CSE 3210","6th-C",P+" Project Lab","106 DSAL",1],[4,"CSE 3210","6th-C",P+" Project Lab","106 DSAL",1]],
Wednesday:[[3,"CSE 3210","6th-B",P+" Project Lab","128 BCL",1],[4,"CSE 3210","6th-B",P+" Project Lab","128 BCL",1],[5,"CSE 3210","6th-D",P+" Project Lab","129 SEL",1],[6,"CSE 3210","6th-D",P+" Project Lab","129 SEL",1]],
Thursday:[[2,"CSE 3209","6th-A",P,"910",0],[4,"CSE 3209","6th-C",P,"513",0]]};
const m=t=>{const[a,b]=t.split(":");return+a*60+ +b};
const f=t=>{let[h,mi]=t.split(":");h=+h;return(h%12||12)+":"+mi+(h>=12?" PM":" AM")};
const tdIdx=()=>{const g=new Date().getDay();return g==5?-1:(g+1)%7};
let sel=Math.max(tdIdx(),0),mode="day";
const $=id=>document.getElementById(id);
function card(c,now){const[s,code,sec,ti,rm,lab]=c,[a,b]=S[s-1];
return `<div class="c"><div class="t">${f(a)}<br>${f(b)}</div><div class="k ${lab?"lab":""} ${now?"now":""}"><div class="r"><span>${code}</span><span>${sec}</span></div><div>${ti}</div><div class="mu">Room: ${rm}</div><span class="tag">B.Sc. in CSE</span></div></div>`}
function hero(){const n=new Date(),i=tdIdx(),cur=n.getHours()*60+n.getMinutes();
if(i<0){return $("hero").innerHTML="<b>Friday — no classes 🎉</b><div class='mu'>Next: Saturday (free), then Sunday</div>"}
const L=R[D[i]];let now=L.find(c=>m(S[c[0]-1][0])<=cur&&cur<m(S[c[0]-1][1]));
if(now)return $("hero").innerHTML=`<b>Now: ${now[1]} ${now[2]}</b><div class="mu">${now[3]} · Room ${now[4]} · ends ${f(S[now[0]-1][1])}</div>`;
let nx=L.find(c=>m(S[c[0]-1][0])>cur);
if(nx){const d=m(S[nx[0]-1][0])-cur;return $("hero").innerHTML=`<b>Next: ${nx[1]} ${nx[2]}</b><div class="mu">${nx[3]} · Room ${nx[4]} · in ${Math.floor(d/60)?Math.floor(d/60)+"h ":""}${d%60}m</div>`}
$("hero").innerHTML=`<b>Done for today ✅</b><div class="mu">${L.length} class${L.length==1?"":"es"} today</div>`}
function render(){const ti=tdIdx(),n=new Date(),cur=n.getHours()*60+n.getMinutes();
$("tabs").style.display=mode=="day"?"flex":"none";
$("tabs").innerHTML=D.map((d,i)=>`<button class="${i==sel?"on":""} ${i==ti?"today":""}" onclick="sel=${i};render()">${d.slice(0,3)}${i==ti?" •":""}</button>`).join("");
$("bd").className=mode=="day"?"on":"";$("bw").className=mode=="week"?"on":"";
if(mode=="day"){const L=R[D[sel]];$("v").innerHTML=`<div class="mu">${D[sel]} · ${L.length} class${L.length==1?"":"es"}</div>`+(L.length?L.map(c=>card(c,sel==ti&&m(S[c[0]-1][0])<=cur&&cur<m(S[c[0]-1][1]))).join(""):'<div class="empty">No classes — enjoy your day ☕</div>')}
else{let h="<div class='sc'><table><tr><th>Day</th>"+S.map((s,i)=>`<th>Slot ${i+1}<br>${f(s[0])}–${f(s[1])}</th>`).join("")+"</tr>";
D.forEach(d=>{h+=`<tr><th>${d.slice(0,3)}</th>`;for(let s=1;s<=6;s++){const c=R[d].find(x=>x[0]==s);h+=c?`<td class="${c[5]?"l":""}"><b>${c[1]}</b> ${c[2]}<br>${c[4]}</td>`:"<td></td>"}h+="</tr>"});
$("v").innerHTML=h+"</table></div>"}hero()}
$("bd").onclick=()=>{mode="day";render()};$("bw").onclick=()=>{mode="week";render()};
render();setInterval(render,60000);
</script></body></html>
