<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OMR Checker – CSE 3210</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f6f3;--card:#fff;--tx:#1c1c1a;--mut:#6b6b66;--bd:#dcdcd5;--ac:#2f5fd0;--ok:#1a8a4a;--no:#d03a3a;--key:#2f78e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--tx:#ececE8;--mut:#9b9b94;--bd:#3a3a37;--ac:#6b93f0;--ok:#4cc27c;--no:#f06b6b;--key:#6fa8ff}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--tx:#ececE8;--mut:#9b9b94;--bd:#3a3a37;--ac:#6b93f0;--ok:#4cc27c;--no:#f06b6b;--key:#6fa8ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 2px}
p.s{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
button,.btn{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;display:inline-block}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
input[type=text],input[type=number],select{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 9px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.kq{display:flex;align-items:center;gap:4px;font-size:13px}
.kq b{width:22px;text-align:right;color:var(--mut);font-weight:500}
.kq button{padding:3px 0;width:26px;background:transparent;color:var(--tx);border:1px solid var(--bd);font-size:13px}
.kq button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
canvas{width:100%;height:auto;border-radius:8px;display:block;background:var(--bg)}
.sc{font-size:34px;font-weight:700}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:10px}
.rc{border:1px solid var(--bd);border-radius:8px;padding:5px 8px;font-size:13px}
.rc.ok{border-color:var(--ok)}.rc.no{border-color:var(--no)}
.rc small{color:var(--mut)}
.err{color:var(--no)}
.mut{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<main>
<h1>OMR Checker</h1>
<p class="s">CSE 3210 · 30 questions · aligns using the 4 corner markers, so paper size (A4 or Letter) doesn’t matter.</p>

<div class="card">
  <div class="row"><b>Answer key – Set</b> <select id="set"><option>A</option><option>B</option></select>
    <input type="text" id="ks" placeholder="Paste 30 letters, e.g. ABCDABCD…" size="34" maxlength="30">
    <button class="g" id="kc">Clear</button></div>
  <div class="kg" id="kg"></div>
  <div class="row" style="margin-top:10px">
    <label>Mark per correct <input type="number" id="mc" value="1" step="0.25" style="width:70px"></label>
    <label>Penalty per wrong <input type="number" id="mw" value="0" step="0.25" style="width:70px"></label>
  </div>
</div>

<div class="card">
  <div class="row">
    <label class="btn">Take photo / choose scan<input type="file" id="f" accept="image/*" hidden></label>
    <label class="mut">Mark sensitivity <input type="range" id="th" min="25" max="75" value="50"></label>
  </div>
  <p class="mut" style="margin:8px 0 0">Tip: sheet flat, good light, all 4 black squares visible, sheet upright.</p>
  <div id="msg" class="err"></div>
</div>

<div class="card" id="rc" hidden>
  <div class="sc" id="sc"></div>
  <div class="mut" id="sub"></div>
  <canvas id="cv" style="margin-top:12px"></canvas>
  <div class="rg" id="rg"></div>
</div>
</main>

<script>
// ---- Layout measured from your PDF (points) ----
const MK=[[79.1,102.5],[530.65,103.15],[79.1,710.75],[530.65,711.05]]; // TL,TR,BL,BR marker centres
const BR=5.5; // bubble radius
const bub=(q,j)=>{const c=q<15?0:1,r=q%15;return[(c?423.1:171)+18*j,200.5+23.35*r]};
const N=30,L=['A','B','C','D'];
const DEF={A:'CCCCAACBBDBBDACCAAABCBDABABACA',B:'DBBDACCAAABCBDABABACACCCCAACBB'};
const parse=s=>[...s].map(c=>'ABCD'.indexOf(c));
let keys={A:parse(DEF.A),B:parse(DEF.B)},cs='A',key=keys.A,last=null;
const $=id=>document.getElementById(id);

// ---- Key UI ----
try{const s=JSON.parse(localStorage.getItem('omrkeys2')||'null');if(s&&s.A&&s.B&&s.A.length===N&&s.B.length===N){keys=s;key=keys[cs]}}catch(e){}
function saveKey(){keys[cs]=key;try{localStorage.setItem('omrkeys2',JSON.stringify(keys))}catch(e){}$('ks').value=key.map(k=>k<0?'-':L[k]).join('');}
function drawKey(){
  $('kg').innerHTML='';
  for(let q=0;q<N;q++){
    const d=document.createElement('div');d.className='kq';d.innerHTML='<b>'+(q+1)+'</b>';
    L.forEach((l,j)=>{const b=document.createElement('button');b.textContent=l;if(key[q]===j)b.className='on';
      b.onclick=()=>{key[q]=key[q]===j?-1:j;saveKey();drawKey();rerun()};d.appendChild(b)});
    $('kg').appendChild(d);
  }
}
$('ks').oninput=e=>{const s=e.target.value.toUpperCase().replace(/[^A-D-]/g,'');
  key=Array(N).fill(-1);for(let i=0;i<N&&i<s.length;i++)key[i]=L.indexOf(s[i]);
  keys[cs]=key;drawKey();try{localStorage.setItem('omrkeys2',JSON.stringify(keys))}catch(x){}rerun()};
$('kc').onclick=()=>{key=Array(N).fill(-1);saveKey();drawKey();rerun()};
saveKey();drawKey();
$('set').onchange=e=>{cs=e.target.value;key=keys[cs];saveKey();drawKey();rerun()};
['th','mc','mw'].forEach(i=>$(i).oninput=rerun);

// ---- Homography ----
function homog(src,dst){
  const A=[];
  for(let i=0;i<4;i++){const[x,y]=src[i],[u,v]=dst[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y,u]);A.push([0,0,0,x,y,1,-v*x,-v*y,v]);}
  for(let c=0;c<8;c++){
    let p=c;for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;
    [A[c],A[p]]=[A[p],A[c]];
    for(let r=0;r<8;r++)if(r!==c){const f=A[r][c]/A[c][c];for(let k=c;k<9;k++)A[r][k]-=f*A[c][k];}
  }
  return A.map((r,i)=>r[8]/r[i]);
}
const mapP=(h,x,y)=>{const w=h[6]*x+h[7]*y+1;return[(h[0]*x+h[1]*y+h[2])/w,(h[3]*x+h[4]*y+h[5])/w]};

// ---- Image loading ----
$('f').onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  const img=new Image();img.onload=()=>{last=img;run()};img.onerror=()=>$('msg').textContent='Could not open that image.';
  img.src=URL.createObjectURL(file);
};
function rerun(){if(last)run()}

// ---- Marker detection ----
function findMarkers(g,W,H){
  const I=new Float64Array((W+1)*(H+1));
  for(let y=0;y<H;y++){let s=0;for(let x=0;x<W;x++){s+=g[y*W+x];I[(y+1)*(W+1)+x+1]=I[y*(W+1)+x+1]+s}}
  const r=Math.round(W/16),dark=new Uint8Array(W*H);
  for(let y=0;y<H;y++){const y0=Math.max(0,y-r),y1=Math.min(H,y+r+1);
    for(let x=0;x<W;x++){const x0=Math.max(0,x-r),x1=Math.min(W,x+r+1);
      const m=(I[y1*(W+1)+x1]-I[y0*(W+1)+x1]-I[y1*(W+1)+x0]+I[y0*(W+1)+x0])/((x1-x0)*(y1-y0));
      if(g[y*W+x]<m*0.72)dark[y*W+x]=1}}
  const lab=new Uint8Array(W*H),st=new Int32Array(W*H),bl=[];
  for(let i=0;i<W*H;i++){
    if(!dark[i]||lab[i])continue;
    let sp=0,n=0,x0=W,x1=0,y0=H,y1=0;st[sp++]=i;lab[i]=1;
    while(sp){const p=st[--sp],x=p%W,y=(p-x)/W;n++;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      if(x>0&&dark[p-1]&&!lab[p-1]){lab[p-1]=1;st[sp++]=p-1}
      if(x<W-1&&dark[p+1]&&!lab[p+1]){lab[p+1]=1;st[sp++]=p+1}
      if(y>0&&dark[p-W]&&!lab[p-W]){lab[p-W]=1;st[sp++]=p-W}
      if(y<H-1&&dark[p+W]&&!lab[p+W]){lab[p+W]=1;st[sp++]=p+W}}
    const w=x1-x0+1,h=y1-y0+1,a=w/h;
    if(w>W*.012&&w<W*.1&&h>W*.012&&h<W*.1&&a>.6&&a<1.6&&n/(w*h)>.8)bl.push([(x0+x1)/2,(y0+y1)/2]);
  }
  const out=[];
  for(const c of [[0,0],[W,0],[0,H],[W,H]]){
    let b=null,bd=1e18;
    for(const p of bl){const d=(p[0]-c[0])**2+(p[1]-c[1])**2;if(d<bd){bd=d;b=p}}
    if(!b)return null;out.push(b);
  }
  return new Set(out.map(String)).size===4?out:null;
}

// ---- Main ----
function run(){
  const img=last,msg=$('msg');msg.textContent='';
  const sc=Math.min(1,1400/Math.max(img.width,img.height)),W=Math.round(img.width*sc),H=Math.round(img.height*sc);
  const cv=$('cv');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
  ctx.drawImage(img,0,0,W,H);
  const d=ctx.getImageData(0,0,W,H).data,g=new Float32Array(W*H);
  for(let i=0;i<W*H;i++)g[i]=.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2];
  const m=findMarkers(g,W,H);
  $('rc').hidden=false;
  if(!m){msg.textContent='Could not find all 4 corner markers. Retake the photo with all four black squares visible, sheet upright.';$('sc').textContent='';$('sub').textContent='';$('rg').innerHTML='';return}
  const h=homog(MK,m);
  // sample every bubble
  const pts=[],cell=[];
  for(let q=0;q<N;q++)for(let j=0;j<4;j++){
    const[bx,by]=bub(q,j),v=[];
    for(let a=-4;a<=4;a++)for(let b=-4;b<=4;b++){
      if(a*a+b*b>16)continue;
      const[u,w]=mapP(h,bx+a*BR*0.85/4,by+b*BR*0.85/4);
      const x=Math.round(u),y=Math.round(w);
      v.push(x>=0&&y>=0&&x<W&&y<H?g[y*W+x]:255);
    }
    cell.push(v);pts.push(...v);
  }
  pts.sort((a,b)=>a-b);const paper=pts[Math.floor(pts.length*.9)];
  const cut=paper*0.62,th=$('th').value/100;
  const mc=+$('mc').value||0,mw=+$('mw').value||0;
  let right=0,wrong=0,blank=0,multi=0;
  const rg=$('rg');rg.innerHTML='';
  ctx.lineWidth=Math.max(2,W/400);
  for(let q=0;q<N;q++){
    const sc4=[0,1,2,3].map(j=>cell[q*4+j].filter(v=>v<cut).length/cell[q*4+j].length);
    const sel=[0,1,2,3].filter(j=>sc4[j]>=th);
    let st,txt;
    if(sel.length===0){txt='—';st='b';blank++}
    else if(sel.length>1){txt=sel.map(j=>L[j]).join('');st='m';multi++}
    else{txt=L[sel[0]];st=key[q]<0?'u':sel[0]===key[q]?'r':'w';if(st==='r')right++;if(st==='w')wrong++}
    // overlay
    for(let j=0;j<4;j++){
      const[bx,by]=bub(q,j),[u,v]=mapP(h,bx,by),[u2,v2]=mapP(h,bx+BR,by),rad=Math.hypot(u2-u,v2-v);
      const isSel=sel.includes(j),isKey=key[q]===j;
      if(!isSel&&!(isKey&&st!=='r'))continue;
      ctx.strokeStyle=isSel?(st==='r'?'#1fbf5a':st==='u'?'#e0a020':'#ef4444'):'#3b8cff';
      ctx.beginPath();ctx.arc(u,v,rad*(isSel?1.25:1.6),0,7);ctx.stroke();
    }
    const c=document.createElement('div');
    c.className='rc '+(st==='r'?'ok':st==='w'||st==='m'?'no':'');
    c.innerHTML='<b>'+(q+1)+'</b> '+txt+' <small>'+(key[q]<0?'(no key)':'key '+L[key[q]])+'</small>';
    rg.appendChild(c);
  }
  // marker crosses
  ctx.strokeStyle='#ff00aa';m.forEach(p=>{ctx.strokeRect(p[0]-8,p[1]-8,16,16)});
  const score=right*mc-wrong*mw;
  $('sc').textContent=score+' / '+(N*mc);
  $('sub').textContent='Set '+cs+' · '+right+' correct · '+wrong+' wrong · '+blank+' blank · '+multi+' multiple marks'+(key.includes(-1)?' · key incomplete':'');
}
</script>
</body>
</html>
